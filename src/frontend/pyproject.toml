[project]
name = "study-tracker-frontend"
version = "0.0.0"
description = "Frontend for Study Tracker applicaion"
readme = "README.md"
authors = [{ name = "AhsanRahat12", email = "rahatahsan@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.34.2",
]

[project.scripts]
study-tracker-frontend = "frontend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
