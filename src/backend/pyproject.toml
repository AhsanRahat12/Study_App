[project]
name = "study-tracker-backend"
version = "0.0.0"
description = "Backend API  Tracker for Cert Prep Study"
readme = "README.md"
authors = [{ name = "AhsanRahat12", email = "rahatahsan@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
study-tracker-api = "backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
