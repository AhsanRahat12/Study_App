<svg width="680" height="760" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Study App CI/CD and GitOps architecture</title>
<desc>Backend and frontend each run an independent pipeline that lints, tests, releases, and builds a scanned container image pushed to ghcr.io. Both feed into the study-app-gitops repository, which updates a dev overlay automatically and a prod overlay via pull request requiring human approval. Flux reconciles the cluster to match the gitops repo.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="760" fill="#ffffff"/>

<path d="M230,96 L230,124 L390,124 L390,156" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M450,96 L450,138 L390,138 L390,156" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="390" y1="212" x2="390" y2="272" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M390,328 L390,358 L230,358 L230,388" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M390,328 L390,368 L450,368 L450,388" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M230,444 L230,474 L390,474 L390,504" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M450,444 L450,486 L390,486 L390,504" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="390" y1="560" x2="390" y2="620" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

